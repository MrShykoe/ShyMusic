name: Build ShyMusic APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать исходники
        run: unzip -q ShyMusic-source.zip -d src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Собрать APK
        working-directory: src
        run: gradle assembleDebug --stacktrace

      - name: Подготовить файл
        run: cp src/app/build/outputs/apk/debug/app-debug.apk ShyMusic.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ShyMusic-apk
          path: ShyMusic.apk

      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ShyMusic, последняя сборка
          files: ShyMusic.apk
